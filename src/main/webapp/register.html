<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:#1e293b;
    width:380px;
    padding:30px;
    border-radius:15px;
}

h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

p{
    color:white;
    text-align:center;
    margin-top:15px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<form action="register" method="post">

<input type="text" name="username" placeholder="Username" required>

<input type="email" name="email" placeholder="Email" required>

<input type="password" id="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
